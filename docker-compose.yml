# Mini Distributed Cloud Object Store: 1 active controller (+1 hot standby, elected via etcd), 4 workers,
# 2 clients (CLI + web UI). Clients and workers reach the active controller through the gateway.
# Metadata: PostgreSQL primary + synchronous replica (Patroni), reached through pg-proxy; periodic backups.
# Start:  docker compose up -d --build
# Web UI: http://localhost:3000     REST API (gateway): http://localhost:8082/api/v1/objects
name: distributed-cloud-store

x-etcd-cmd-etcd1: &etcd-cmd-etcd1 [etcd, --name=etcd1, --data-dir=/etcd-data, --listen-client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://etcd1:2379, --listen-peer-urls=http://0.0.0.0:2380, --initial-advertise-peer-urls=http://etcd1:2380, "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", --initial-cluster-state=new, --initial-cluster-token=objectstore-etcd]
x-etcd-cmd-etcd2: &etcd-cmd-etcd2 [etcd, --name=etcd2, --data-dir=/etcd-data, --listen-client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://etcd2:2379, --listen-peer-urls=http://0.0.0.0:2380, --initial-advertise-peer-urls=http://etcd2:2380, "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", --initial-cluster-state=new, --initial-cluster-token=objectstore-etcd]
x-etcd-cmd-etcd3: &etcd-cmd-etcd3 [etcd, --name=etcd3, --data-dir=/etcd-data, --listen-client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://etcd3:2379, --listen-peer-urls=http://0.0.0.0:2380, --initial-advertise-peer-urls=http://etcd3:2380, "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", --initial-cluster-state=new, --initial-cluster-token=objectstore-etcd]

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
    interval: 3s
    timeout: 3s
    retries: 20
  networks:
    - objectstore-net

x-pg-env: &pg-env
  PATRONI_SCOPE: objectstore-metadata
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: postgres-admin
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: replicator
  PATRONI_REWIND_USERNAME: postgres
  PATRONI_REWIND_PASSWORD: postgres-admin
  APP_DB_USER: store
  APP_DB_PASSWORD: store
  APP_DB_NAME: objectstore

x-pg-node: &pg-node
  build:
    context: ./postgres
  image: objectstore-postgres:latest
  depends_on:
    etcd1:
      condition: service_healthy
    etcd2:
      condition: service_healthy
    etcd3:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
    interval: 3s
    timeout: 3s
    retries: 60
    start_period: 20s
  networks:
    - objectstore-net

x-controller-env: &controller-env
  DB_URL: jdbc:postgresql://pg-proxy:5432/objectstore?connectTimeout=3&tcpKeepAlive=true
  DB_USER: store
  DB_PASS: store
  ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
  ELECTION_LEASE_TTL_SECONDS: 5
  STORE_CHUNK_SIZE: 1048576
  STORE_REPLICATION_FACTOR: 2
  STORE_HEARTBEAT_TIMEOUT_MS: 10000
  STORE_RE_REPLICATION_GRACE_MS: ${RE_REPLICATION_GRACE_MS:-30000}
  STORE_SCRUB_INTERVAL_MS: ${SCRUB_INTERVAL_MS:-60000}

x-controller: &controller
  build:
    context: .
    dockerfile: controller/Dockerfile
  image: objectstore-controller:latest
  depends_on:
    pg-proxy:
      condition: service_healthy
    etcd1:
      condition: service_healthy
    etcd2:
      condition: service_healthy
    etcd3:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 15s
  networks:
    - objectstore-net

x-worker: &worker
  build:
    context: .
    dockerfile: worker/Dockerfile
  image: objectstore-worker:latest
  depends_on:
    gateway:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  networks:
    - objectstore-net

services:
  # Metadata store: PostgreSQL in high availability. Two nodes run under Patroni, which elects the primary
  # through etcd and keeps the other node a synchronous streaming replica; if the primary fails, the replica
  # is promoted. Controllers always connect through pg-proxy, which routes to the current primary.
  postgres1:
    <<: *pg-node
    container_name: postgres1
    environment:
      <<: *pg-env
      PATRONI_NAME: postgres1
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres1:5432
    volumes:
      - pg1-data:/var/lib/postgresql/data
  postgres2:
    <<: *pg-node
    container_name: postgres2
    environment:
      <<: *pg-env
      PATRONI_NAME: postgres2
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres2:5432
    volumes:
      - pg2-data:/var/lib/postgresql/data

  # The one database address for the controllers (pg-proxy:5432; host port 5433 for inspection):
  # always the current primary.
  pg-proxy:
    build:
      context: ./pg-proxy
    image: objectstore-pg-proxy:latest
    container_name: pg-proxy
    ports:
      - "5433:5432"
    depends_on:
      - postgres1
      - postgres2
    healthcheck:
      # healthy while a primary is available
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/ready"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks:
      - objectstore-net

  # Periodic metadata backups (pg_dump) into the pg-backups volume. Restore: scripts/restore-metadata.sh
  pg-backup:
    build:
      context: ./pg-backup
    image: objectstore-pg-backup:latest
    container_name: pg-backup
    environment:
      PGHOST: pg-proxy
      PGPORT: 5432
      PGUSER: store
      PGPASSWORD: store
      PGDATABASE: objectstore
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-600}
      BACKUP_KEEP: ${BACKUP_KEEP:-24}
    volumes:
      - pg-backups:/backups
    depends_on:
      pg-proxy:
        condition: service_healthy
    networks:
      - objectstore-net

  # Coordination service used ONLY for controller leader election: a 3-node etcd cluster (Raft quorum),
  # so election keeps working while any one etcd node is down.
  etcd1:
    <<: *etcd
    container_name: etcd1
    command: *etcd-cmd-etcd1
    volumes:
      - etcd1-data:/etcd-data
  etcd2:
    <<: *etcd
    container_name: etcd2
    command: *etcd-cmd-etcd2
    volumes:
      - etcd2-data:/etcd-data
  etcd3:
    <<: *etcd
    container_name: etcd3
    command: *etcd-cmd-etcd3
    volumes:
      - etcd3-data:/etcd-data

  # Two controller instances: one ACTIVE (elected through etcd), one hot STANDBY that takes over if it fails.
  # Both use the same PostgreSQL metadata store, so the standby knows everything the moment it takes over.
  controller1:
    <<: *controller
    container_name: controller1
    environment:
      <<: *controller-env
      CONTROLLER_ID: controller1
  controller2:
    <<: *controller
    container_name: controller2
    environment:
      <<: *controller-env
      CONTROLLER_ID: controller2

  # Gateway: the one stable controller address (host port 8082, http://gateway:8080 inside the network).
  # It routes every request to whichever controller is currently active.
  gateway:
    build:
      context: ./gateway
    image: objectstore-gateway:latest
    container_name: gateway
    ports:
      - "${CONTROLLER_PORT:-8082}:8080"
    depends_on:
      - controller1
      - controller2
    healthcheck:
      # healthy once some controller is active
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/internal/controller/leader"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks:
      - objectstore-net

  worker1:
    <<: *worker
    container_name: worker1
    environment:
      WORKER_ID: worker1
      WORKER_URL: http://worker1:8081
      CONTROLLER_URL: http://gateway:8080
      DATA_DIR: /data/chunks
      WORKER_HEARTBEAT_INTERVAL_MS: 3000
    volumes:
      - worker1-data:/data/chunks

  worker2:
    <<: *worker
    container_name: worker2
    environment:
      WORKER_ID: worker2
      WORKER_URL: http://worker2:8081
      CONTROLLER_URL: http://gateway:8080
      DATA_DIR: /data/chunks
      WORKER_HEARTBEAT_INTERVAL_MS: 3000
    volumes:
      - worker2-data:/data/chunks

  worker3:
    <<: *worker
    container_name: worker3
    environment:
      WORKER_ID: worker3
      WORKER_URL: http://worker3:8081
      CONTROLLER_URL: http://gateway:8080
      DATA_DIR: /data/chunks
      WORKER_HEARTBEAT_INTERVAL_MS: 3000
    volumes:
      - worker3-data:/data/chunks

  worker4:
    <<: *worker
    container_name: worker4
    environment:
      WORKER_ID: worker4
      WORKER_URL: http://worker4:8081
      CONTROLLER_URL: http://gateway:8080
      DATA_DIR: /data/chunks
      WORKER_HEARTBEAT_INTERVAL_MS: 3000
    volumes:
      - worker4-data:/data/chunks

  # Client 1: command-line client.  docker exec -it client objstore help
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: objectstore-client:latest
    container_name: client
    environment:
      OBJSTORE_URL: http://gateway:8080
    volumes:
      - ./files:/files
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - objectstore-net

  # Client 2: browser UI (nginx serves the page and proxies /api to the controller)
  web:
    build:
      context: ./web
    image: objectstore-web:latest
    container_name: web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - gateway
    networks:
      - objectstore-net

volumes:
  pg1-data:
  pg2-data:
  pg-backups:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:

networks:
  objectstore-net:
    driver: bridge
