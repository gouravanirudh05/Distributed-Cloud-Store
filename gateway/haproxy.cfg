# Gateway in front of the controllers: the single, stable address used by clients, the web UI and the workers.
# It health-checks every controller instance and sends traffic only to the one that is currently the ACTIVE
# controller (GET /internal/controller/leader answers 200 there and 503 on standbys).
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlog-normal
    timeout connect 2s
    timeout client  10m
    timeout server  10m
    timeout http-request 10m
    errorfile 503 /usr/local/etc/haproxy/no-active-controller.http

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend api
    bind :8080
    default_backend controllers

backend controllers
    option httpchk GET /internal/controller/leader
    http-check expect status 200
    # check every 500 ms; 2 failed checks take a controller out, 1 good check puts it in
    default-server inter 500ms fall 2 rise 1 resolvers docker init-addr last,libc,none
    server controller1 controller1:8080 check
    server controller2 controller2:8080 check
