# Patroni configuration shared by postgres1 and postgres2. Per-node values (name, addresses) and passwords
# come from PATRONI_* environment variables set in docker-compose.yml.
scope: objectstore-metadata
namespace: /objectstore/patroni/

restapi:
  listen: 0.0.0.0:8008

etcd3:
  # the same etcd cluster the controllers use for their own leader election
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

bootstrap:
  dcs:
    ttl: 20                 # primary's leader key lease: a dead primary is replaced after at most ~20-30 s
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    # a commit is acknowledged only after the replica has it too (while a replica is available),
    # so a failover never loses committed metadata
    synchronous_mode: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_connections: 100
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  # runs once, on the node that creates the cluster: creates the application user and database
  post_bootstrap: /usr/local/bin/post-bootstrap.sh

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/15/bin
  pgpass: /tmp/pgpass
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
