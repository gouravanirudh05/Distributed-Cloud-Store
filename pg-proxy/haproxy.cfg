# Metadata database proxy: the controllers connect here (pg-proxy:5432) and always reach the CURRENT
# PostgreSQL primary. Patroni's REST API answers GET /primary with 200 only on the primary node.
global
    log stdout format raw local0 info

defaults
    log global
    mode tcp
    timeout connect 2s
    timeout client 30m
    timeout server 30m
    timeout check 2s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

# readiness endpoint for the container health check: healthy only while a primary is known
frontend ready
    mode http
    bind :8404
    acl no_primary nbsrv(primary) lt 1
    monitor-uri /ready
    monitor fail if no_primary

frontend postgres
    bind :5432
    default_backend primary

backend primary
    option httpchk GET /primary
    http-check expect status 200
    # check every second; when a node stops being primary, its client connections are cut at once so the
    # controllers reconnect (to the new primary) instead of writing to a demoted node
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server postgres1 postgres1:5432 check port 8008
    server postgres2 postgres2:5432 check port 8008
