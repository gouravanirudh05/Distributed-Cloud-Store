# Web client: serves the static UI and forwards /api/* to the gateway, i.e. the active controller (the UI never talks to workers).
server {
    listen 80;
    server_name _;

    client_max_body_size 2g;

    # Docker's embedded DNS; resolve "gateway" lazily so nginx starts even if it is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $controller http://gateway:8080;
    set $runner http://demo-runner:8090;

    location /api/ {
        proxy_pass $controller;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # demo scenario runner (buttons at the bottom of the page)
    location /runner/ {
        proxy_pass $runner;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
